services:
  omniroute:
    image: diegosouzapw/omniroute:3.8.49
    container_name: omniroute
    ports:
      - "20128:20128"
    environment:
      - OMNIROUTE_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:20128/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
